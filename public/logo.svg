<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-label="Vigie">
  <defs>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BA1E2"/>
      <stop offset="60%" stop-color="#2F4F8E"/>
      <stop offset="100%" stop-color="#0F2A5F"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8F8"/>
    </linearGradient>
  </defs>

  <!-- Swoosh tail -->
  <path d="M 175 95 Q 130 130 95 105"
        stroke="#1F3A75" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 175 95 Q 130 130 95 105"
        stroke="#4A8FE0" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Ball -->
  <circle cx="195" cy="55" r="42" fill="url(#ballGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.4"/>
  <!-- Ball seams (handball pentagon hint) -->
  <path d="M 175 38 L 195 55 L 215 38 M 175 72 L 195 55 L 215 72"
        stroke="#061538" stroke-width="2" fill="none" opacity="0.7"/>
  <circle cx="195" cy="55" r="6" fill="#061538" opacity="0.55"/>

  <!-- Wordmark "Vigie" -->
  <text x="6" y="100"
        font-family="Poppins, system-ui, sans-serif"
        font-weight="800"
        font-size="98"
        letter-spacing="-3"
        fill="url(#textGrad)"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-opacity="0.6">Vigie</text>
</svg>
